    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/fs.py "пирог с грибами" "пирожки с капустой" "пирожок с капустой" "блины с творогом и изюмом" "плов с курицей" "сырники со сметаной" "драники" "пирог с мясом и сыром" "макароны по-флотски" "котлета куриная"
