name: probe-sosedi
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sosedi-dostavka.by API (temporary, run 2)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36"
          curl -sSL -m 25 -A "$UA" https://sosedi-dostavka.by/ -o home.html
          grep -oE 'src="[^"]+\.js"' home.html
          for js in $(grep -oE '/static/js/[^"]+\.js' home.html); do
            curl -sSL -m 40 -A "$UA" "https://sosedi-dostavka.by$js" -o b.js; echo "=== $js $(wc -c < b.js)"
            grep -oE 'https?://[a-zA-Z0-9.-]+(/[a-zA-Z0-9_./-]*)?' b.js | sort -u | grep -viE 'w3|react|schema|google|yandex|facebook|apple|mozilla|github|sentry' | head -40
            grep -oE '"/[a-zA-Z0-9_./-]*(api|search|product|catalog|goods|item)[a-zA-Z0-9_./{}-]*"' b.js | sort -u | head -60
            grep -oE '.{60}(search|Search)[^"]{0,10}".{0,80}' b.js | head -15
            grep -oE '.{40}(nutri|calor|energy|protein|proteins|fat|carbo|kcal|belki|bzhu|БЖУ|белк|ккал).{60}' b.js | head -25
          done
