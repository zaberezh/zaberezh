name: probe-sosedi
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sosedi API (temporary, run 5)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36"
          curl -sSL -m 40 -A "$UA" "https://sosedi-dostavka.by/static/js/main.724c4081.js" -o b.js
          echo "=== baseURL"; grep -oE '.{120}baseURL.{160}' b.js | head -5
          echo "=== productsList"; grep -oE '.{200}api/productsList/.{200}' b.js | head -3
          echo "=== search usage"; grep -oE '.{160}(searchText|searchQuery|search:|"search"|query:).{160}' b.js | grep -v "pathname" | head -8
          echo "=== headers set"; grep -oE '.{100}headers.{140}' b.js | grep -iE 'darkstore|store|lang|x-' | head -8
          H=(-H "Accept: application/json" -H "Origin: https://sosedi-dostavka.by" -H "Referer: https://sosedi-dostavka.by/")
          q="%D1%81%D1%8B%D1%80"
          for u in "https://api.bazar-store.by/products/?search=$q" "https://api.bazar-store.by/api/productsList/?search=$q" "https://api.bazar-store.by/api/products/?search=$q" "https://api.bazar-store.by/api/v1/products/?search=$q" "https://api.bazar-store.by/products/search/?q=$q" "https://api.bazar-store.by/darkstores/"; do
            echo "=== $u"; curl -sS -m 15 -A "$UA" "${H[@]}" -w "\nHTTP %{http_code}\n" "$u" | head -c 700; echo
          done
