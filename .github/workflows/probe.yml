name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          cp .github/probe/LiveFatSecretTest.kt forma/core/src/test/kotlin/by/zaberezh/forma/core/
          cd forma && LIVE=fs ./gradlew :core:test --tests '*LiveFatSecretTest*' -i 2>&1 | grep "LIVE" || true
