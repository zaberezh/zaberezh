name: probe-sosedi
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sosedi-dostavka.by structure (temporary)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36"
          get() { curl -sSL -m 25 -A "$UA" -H "Accept-Language: ru-RU,ru;q=0.9" -o page.html -w "HTTP %{http_code} size %{size_download} final %{url_effective}\n" "$1" || echo "curl failed"; }
          echo "=== HOME"; get "https://sosedi-dostavka.by/"
          grep -oiE '<form[^>]*>' page.html | head -5
          grep -oiE 'name="[a-z_]*q[a-z_]*"' page.html | sort -u | head
          grep -oiE 'https?://[a-z0-9.-]*sosedi[a-z0-9.-]*/[a-z0-9/_.-]*(api|graphql|search)[a-z0-9/_.?=&-]*' page.html | sort -u | head -20
          grep -oiE '"/[a-z0-9_-]*(api|search)[a-z0-9/_.?=&-]*' page.html | sort -u | head -20
          grep -oE 'href="[^"]+"' page.html | sort -u | head -60
          for u in "https://sosedi-dostavka.by/search/?q=%D1%81%D1%8B%D1%80" "https://sosedi-dostavka.by/search?query=%D1%81%D1%8B%D1%80" "https://sosedi-dostavka.by/catalog/?q=%D1%81%D1%8B%D1%80" "https://sosedi-dostavka.by/search?q=%D1%81%D1%8B%D1%80"; do
            echo "=== $u"; get "$u"
            grep -oE 'href="[^"]+"' page.html | grep -viE '\.(css|js|png|svg|ico)' | sort -u | head -40
            grep -oiE '(белк|жир|углев|ккал|калори)[^<]{0,80}' page.html | head -5
            head -c 600 page.html | tr '\n' ' '; echo
          done
