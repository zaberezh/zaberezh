name: probe-sosedi
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sosedi API calls (temporary, run 4)
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36"
          curl -sSL -m 40 -A "$UA" "https://sosedi-dostavka.by/static/js/main.724c4081.js" -o b.js
          echo "=== get/post calls"; grep -oE '\.(get|post|put)\("[^"]{1,80}"' b.js | sort -u | head -80
          echo "=== get with concat"; grep -oE '\.(get|post)\("[^"]{0,60}"\.concat\([^)]{0,40}\)' b.js | sort -u | head -40
          echo "=== template-ish paths"; grep -oE '"/[a-z-]+/"\.concat' b.js | sort -u | head -40
          echo "=== product fields"; grep -oE '.{300}composition:C.{300}' b.js | head -2
          q="%D1%81%D1%8B%D1%80"
          for u in "https://api.bazar-store.by/products?search=$q" "https://api.bazar-store.by/products/search?query=$q" "https://api.bazar-store.by/search?query=$q" "https://api.bazar-store.by/v1/products?search=$q" "https://api.bazar-store.by/products?query=$q" "https://api.bazar-store.by/"; do
            echo "=== $u"; curl -sS -m 20 -A "$UA" -H "Accept: application/json" -H "Origin: https://sosedi-dostavka.by" -H "Referer: https://sosedi-dostavka.by/" -w "\nHTTP %{http_code}\n" "$u" | head -c 900; echo
          done
