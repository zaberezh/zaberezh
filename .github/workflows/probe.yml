name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml', '.github/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/fs2.py "пирожка с капустой" "пирожков с капустой" "сырника" "котлеты куриные" "блинов с творогом" "голубцы" "суп с фрикадельками" "оливье" "пельмени" "шаурма" "пицца пепперони" "борщ украинский" "манты" "запеканка творожная"
