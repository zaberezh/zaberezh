name: forma

on:
  push:
    paths: ["forma/**", ".github/workflows/forma.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test + build APK
        run: ./gradlew :core:test :app:assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk forma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: forma-apk
          path: forma/forma.apk
      - name: Release (скачать APK с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma-${{ github.run_number }}
          name: Forma 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: forma/forma.apk
          make_latest: true
