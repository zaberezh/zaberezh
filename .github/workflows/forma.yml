name: forma

on:
  push:
    paths: ["forma/**", ".github/workflows/forma.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test + build APK
        run: ./gradlew :core:test :app:assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk grind.apk
      - uses: actions/upload-artifact@v4
        with:
          name: grind-apk
          path: forma/grind.apk
      # релиз — встроенным gh, без стороннего action: меньше чужого кода с правом записи в репозиторий
      - name: Release (скачать APK с телефона)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: gh release create "grind-$N" grind.apk --title "Grind 0.1.$N" --target "$SHA" --latest --notes "APK для телефона: grind.apk"
